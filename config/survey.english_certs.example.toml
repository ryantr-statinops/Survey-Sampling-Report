[report]
title = "Báo cáo khảo sát lựa chọn chứng chỉ tiếng Anh"
locale = "vi-VN"
display_timezone = "Asia/Ho_Chi_Minh"
research_question = "Sinh viên lựa chọn chứng chỉ tiếng Anh nào, vì mục đích gì, và cần thông tin/hỗ trợ nào từ nhà trường?"
sampling_method = "Phiếu khảo sát Google Forms; mẫu thuận tiện, không xác minh duy nhất, không suy luận quần thể."
collection_period = "05/10/2026 – 02/11/2026 (xác nhận lại theo ngày trích xuất thực tế)"
conclusion = "Kết quả là mô tả mẫu đã trả lời; không suy diễn nhân quả hay đại diện toàn trường khi chưa có thiết kế lấy mẫu."

